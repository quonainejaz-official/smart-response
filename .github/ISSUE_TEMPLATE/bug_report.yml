name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PHP, Laravel, and SmartResponse versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal example and expected versus actual output
    validations:
      required: true
